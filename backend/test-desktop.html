<!DOCTYPE html>
<html>
<head>
  <title>DrawPad - Desktop Test Client</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; cursor: pointer; }
    #otp { 
      font-size: 72px; 
      font-weight: bold; 
      color: #2c3e50;
      letter-spacing: 10px;
      margin: 20px 0;
      display: none;
    }
    #canvas {
      border: 2px solid #2c3e50;
      display: none;
      margin-top: 20px;
      background: white;
    }
    #log { 
      margin-top: 20px; 
      padding: 10px; 
      background: #f0f0f0; 
      border: 1px solid #ccc;
      font-family: monospace;
      max-height: 300px;
      overflow-y: auto;
    }
    .success { color: green; }
    .error { color: red; }
    #status {
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
      font-weight: bold;
    }
    .connected { background: #d4edda; color: #155724; }
    .disconnected { background: #f8d7da; color: #721c24; }
    .paired { background: #cce5ff; color: #004085; }
  </style>
</head>
<body>
  <h1>🖥️ DrawPad - Desktop</h1>

  <div id="status" class="disconnected">Not Connected</div>

  <div>
    <button onclick="connectDesktop()">Connect as Desktop</button>
    <button onclick="disconnectSocket()">Disconnect</button>
    <button onclick="getStats()">Get Stats</button>
  </div>

  <div>
    <h2>Your OTP Code:</h2>
    <div id="otp">----</div>
    <p id="otpHint" style="display:none; color: gray;">Show this code to your mobile device</p>
  </div>

  <canvas id="canvas" width="800" height="500"></canvas>

  <div id="log"></div>

  <script>
    let socket = null;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const className = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
      logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = type;
    }

    function sendDimensions() {
        if (!socket) return;
        const dimensions = {
            width: canvas.width,
            height: canvas.height
        };
        socket.emit('canvasDimensions', dimensions);
        log(`📐 Sent canvas dimensions: ${dimensions.width}x${dimensions.height}`, 'success');
    }

    function connectDesktop() {
      if (socket) {
        log('Already connected!', 'error');
        return;
      }

      // If testing on real phone, change 'localhost' to your Laptop's IP
      socket = io('http://localhost:3000'); 

      socket.on('connect', () => {
        log('✓ Connected to server!', 'success');
        setStatus('Connected — waiting for OTP...', 'connected');
        socket.emit('registerDesktop');
        log('Registering as Desktop...');
      });

      socket.on('otp', ({ otp }) => {
        log(`✓ Got OTP: ${otp}`, 'success');
        const otpDiv = document.getElementById('otp');
        otpDiv.textContent = otp;
        otpDiv.style.display = 'block';
        document.getElementById('otpHint').style.display = 'block';
        setStatus('Waiting for mobile to pair...', 'connected');
      });

      // LISTENERS MOVED TO TOP LEVEL FOR RELIABILITY
      
      // Handshake: Mobile says "I am ready", Desktop sends dimensions
      socket.on('getCanvasDimensions', () => {
        log("📱 Mobile is ready! Resending dimensions...", 'success');
        sendDimensions();
      });

      socket.on('pairingSuccess', ({ message }) => {
        log(`✓ ${message}`, 'success');
        setStatus('✅ Paired with mobile! Ready to draw.', 'paired');
        document.getElementById('otp').style.display = 'none';
        document.getElementById('otpHint').style.display = 'none';
        canvas.style.display = 'block';
        
        // Initial send just in case mobile is already listening
        sendDimensions();
      });

      socket.on('draw', (data) => {
        drawOnCanvas(data);
      });

      socket.on('error', ({ message }) => {
        log(`✗ Error: ${message}`, 'error');
      });

      socket.on('disconnect', () => {
        log('✗ Disconnected from server', 'error');
        setStatus('Disconnected', 'disconnected');
        socket = null;
        document.getElementById('otp').style.display = 'none';
        canvas.style.display = 'none';
      });
    }

    function drawOnCanvas(data) {
      ctx.strokeStyle = data.color || '#000000';
      ctx.lineWidth = data.size || 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (data.type === 'start') {
        ctx.beginPath();
        ctx.moveTo(data.x, data.y);
      } else if (data.type === 'move') {
        ctx.lineTo(data.x, data.y);
        ctx.stroke();
      } else if (data.type === 'end') {
        ctx.closePath();
      } else if (data.type === 'clear') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function disconnectSocket() {
      if (socket) {
        socket.disconnect();
        socket = null;
        log('Disconnected manually');
        setStatus('Disconnected', 'disconnected');
        document.getElementById('otp').textContent = '----';
        document.getElementById('otp').style.display = 'none';
        canvas.style.display = 'none';
      }
    }

    async function getStats() {
      try {
        const response = await fetch('http://localhost:3000/api/devices/stats');
        const data = await response.json();
        log('Stats: ' + JSON.stringify(data, null, 2), 'success');
      } catch (error) {
        log('Error fetching stats: ' + error.message, 'error');
      }
    }
  </script>
</body>
</html>
