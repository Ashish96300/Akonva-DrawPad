<!DOCTYPE html>
<html>
<head>
  <title>DrawPad Test Client</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    #pairingCode { 
      font-size: 48px; 
      font-weight: bold; 
      color: #2196F3; 
      margin: 20px 0;
      letter-spacing: 8px;
    }
    #log { 
      margin-top: 20px; 
      padding: 10px; 
      background: #f0f0f0; 
      border: 1px solid #ccc;
      font-family: monospace;
      max-height: 400px;
      overflow-y: auto;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>DrawPad WebSocket Test Client</h1>
  
  <div>
    <button onclick="connectDesktop()">Connect as Desktop</button>
    <button onclick="connectMobile()">Connect as Mobile</button>
    <button onclick="disconnect()">Disconnect</button>
  </div>

  <div id="pairingCodeSection" style="display: none;">
    <h2>Pairing Code:</h2>
    <div id="pairingCode"></div>
    <p style="color: #666;">Enter this code in the mobile app</p>
  </div>

  <div id="log"></div>

  <script>
    let ws = null;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const className = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
      logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connectDesktop() {
      if (ws) {
        log('Already connected!', 'error');
        return;
      }

      ws = new WebSocket('ws://localhost:3000');
      
      ws.onopen = () => {
        log('✓ WebSocket connected!', 'success');
        
        const deviceId = 'desktop_' + Math.random().toString(36).substr(2, 9);
        log(`Registering as Desktop with ID: ${deviceId}`);
        
        ws.send(JSON.stringify({
          type: 'REGISTER_DESKTOP',
          deviceId: deviceId
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        log('← Received: ' + JSON.stringify(data, null, 2), 'success');
        
        // Show pairing code
        if (data.pairingCode) {
          document.getElementById('pairingCodeSection').style.display = 'block';
          document.getElementById('pairingCode').textContent = data.pairingCode;
          log('🔑 Pairing code generated: ' + data.pairingCode, 'success');
        }
      };

      ws.onerror = (error) => {
        log('✗ WebSocket error', 'error');
      };

      ws.onclose = () => {
        log('✗ WebSocket disconnected', 'error');
        ws = null;
        document.getElementById('pairingCodeSection').style.display = 'none';
      };
    }

    function connectMobile() {
      if (ws) {
        log('Already connected!', 'error');
        return;
      }

      ws = new WebSocket('ws://localhost:3000');
      
      ws.onopen = () => {
        log('✓ WebSocket connected!', 'success');
        
        const deviceId = 'mobile_' + Math.random().toString(36).substr(2, 9);
        log(`Registering as Mobile with ID: ${deviceId}`);
        
        ws.send(JSON.stringify({
          type: 'REGISTER_MOBILE',
          deviceId: deviceId
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        log('← Received: ' + JSON.stringify(data, null, 2), 'success');
      };

      ws.onerror = (error) => {
        log('✗ WebSocket error', 'error');
      };

      ws.onclose = () => {
        log('✗ WebSocket disconnected', 'error');
        ws = null;
      };
    }

    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
        log('Disconnected manually');
      } else {
        log('Not connected!', 'error');
      }
    }
  </script>
</body>
</html>
